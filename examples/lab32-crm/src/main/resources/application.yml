spring:
  application:
    name: lab32-crm

account:
  api:
    base-url: ${ACCOUNT_API_BASE_URL:http://localhost:8089}

resilience4j:
  circuitbreaker:
    instances:
      accountProfile:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      accountProfile:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - com.northstar.crm.account.TemporaryAccountException
  timelimiter:
    instances:
      accountProfile:
        timeoutDuration: 1500ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers,circuitbreakerevents

logging:
  level:
    io.github.resilience4j.retry: DEBUG